<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mesai Takip Sistemi</title>
<!-- Google Fonts (Inter) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ GİRİŞ / KAYIT EKRANI ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo"><img src="unnamed (1).png" alt="Şirket Logosu"></div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">Giriş Yap</button>
      <button class="auth-tab" id="tabRegister">Kayıt Ol</button>
    </div>

    <!-- GİRİŞ FORMU -->
    <form id="loginForm">
      <div class="form-group">
        <label>Kullanıcı</label>
        <select id="loginUser" required></select>
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" placeholder="••••••••" value="demo123">
      </div>
      <button type="submit" class="btn btn-primary">Giriş Yap</button>
      <div class="auth-demo-list">
        <p>Demo hesaplardan biriyle hızlı giriş:</p>
        <div id="demoChips"></div>
      </div>
    </form>

    <!-- KAYIT FORMU -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label>Ad</label>
        <input type="text" id="regAd" placeholder="Adınız" required>
      </div>
      <div class="form-group">
        <label>Soyad</label>
        <input type="text" id="regSoyad" placeholder="Soyadınız" required>
      </div>
      <div class="form-group">
        <label>Görev</label>
        <input type="text" id="regGorev" placeholder="Örn: Depo Personeli" required>
      </div>
      <div class="form-group">
        <label>Departman</label>
        <input type="text" id="regDepartman" placeholder="Örn: Operasyon">
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select id="regRol" required>
          <option value="">Seçiniz…</option>
          <option value="calisan">Çalışan</option>
          <option value="sef">Şef</option>
          <option value="ik">İnsan Kaynakları</option>
          <option value="yonetici">Yönetici</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Kayıt Ol</button>
      <p class="auth-hint">Kayıt sonrası giriş ekranından sisteme giriş yapabilirsiniz.</p>
    </form>
  </div>
</div>

<!-- ============ UYGULAMA EKRANI ============ -->
<div id="appScreen" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="unnamed (1).png" alt="Şirket Logosu"></div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer" id="sidebarProfileBtn" style="cursor:pointer; padding:12px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; transition:0.2s;">
      <div class="avatar" id="sidebarAvatar" style="width:38px; height:38px; font-size:14px; flex-shrink:0;"></div>
      <div class="user-details" style="flex:1; overflow:hidden;">
        <div class="uname" id="sidebarUserName" style="font-size:13.5px; font-weight:700; color:var(--navy); white-space:nowrap; text-overflow:ellipsis; overflow:hidden;"></div>
        <div class="urole" id="sidebarUserRole" style="font-size:11.5px; color:var(--text-soft); white-space:nowrap; text-overflow:ellipsis; overflow:hidden;"></div>
      </div>
      <div style="color:var(--text-soft); font-size:16px;">⚙️</div>
    </div>
  </aside>

  <main class="main" id="mainContent"></main>
</div>

<div id="toast"></div>

<!-- html2pdf: PDF raporu için -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
